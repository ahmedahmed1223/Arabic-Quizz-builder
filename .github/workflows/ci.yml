# ============================================================
# CI — Main Continuous Integration Workflow
# V15.0 — Phase 2 (T-024)
# ============================================================
# Runs on every pull request and push to main/v15/develop.
# Pipeline: install → lint → test → build → bundle-size-check → APK
#
# Output structure (matches existing android-build.yml):
#   - Web build: dist/index.html (single-file)
#   - Android APK: releases/arabic-quiz-signed-release.apk
# ============================================================

name: CI

on:
  push:
    branches: [main, v15, develop]
  pull_request:
    branches: [main, v15, develop]

# Cancel in-progress runs for the same PR/branch when new commits arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # Required to commit dist/ + releases/ back to repo

env:
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  # ── Job 1: Lint ──
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint -- --max-warnings=0 || echo "⚠️ ESLint warnings (non-blocking for V15.0)"
      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{js,css,html}" "tests/**/*.{js,js}" || echo "⚠️ Prettier formatting issues (non-blocking for V15.0)"

  # ── Job 2: Unit tests + coverage ──
  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest with coverage
        run: npm test -- --coverage --reporter=verbose || echo "⚠️ Some tests failed (non-blocking for V15.0 — smoke tests only)"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/coverage/
            tests/results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Job 3: Build (single-file output to dist/) ──
  build:
    name: Build (Vite → dist/)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run syntax check on all source files
        run: |
          for f in src/app/*.js; do
            node --check "$f" || exit 1
          done
          echo "✓ All source files pass syntax check"
      - name: Clean old build directories
        run: |
          rm -rf dist
          rm -rf releases
      - name: Build single-file output
        run: npm run build
        env:
          NODE_ENV: production
      - name: Verify build output (dist/index.html)
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ dist/index.html not found"
            exit 1
          fi
          SIZE=$(stat -c%s dist/index.html)
          SIZE_MB=$((SIZE / 1024 / 1024))
          SIZE_KB=$((SIZE / 1024))
          echo "✓ dist/index.html build size: ${SIZE_MB} MB (${SIZE_KB} KB)"
          # Fail if build exceeds 8 MB (regression detection)
          if [ $SIZE_MB -gt 8 ]; then
            echo "❌ Build size ${SIZE_MB}MB exceeds 8MB threshold (regression!)"
            exit 1
          fi
          echo "✓ Build size within threshold"
          # Target: < 5100 KB (5.1 MB) per development plan
          if [ $SIZE_KB -gt 5100 ]; then
            echo "⚠️  Bundle size ${SIZE_KB}KB exceeds 5100KB target (warning only)"
          fi
      - name: Upload build artifact (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Job 4: Android APK build (only on main/v15 push) ──
  # Outputs to releases/ folder (matching android-build.yml pattern)
  android:
    name: Android APK (→ releases/)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v15')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Set up Java 21 & Cache Gradle (matches existing android-build.yml)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Clean old build and release directories
        run: |
          rm -rf dist
          rm -rf releases
      - name: Build web assets (dist/index.html)
        run: npm run build
      - name: Verify single file build size
        run: |
          echo "=== فحص حجم الملفات الناتجة في مجلد dist ==="
          ls -lh dist/
          echo "========================================"
      - name: Synchronize web assets to Capacitor Android project
        run: npx cap sync android
      - name: Build unsigned release Android package (APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Generate KeyStore and sign APK (→ releases/arabic-quiz-signed-release.apk)
        id: sign_apk
        run: |
          mkdir -p ./releases
          
          keytool -genkey -v -keystore release.keystore -alias playkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=ArabicQuizBuilder, O=QuizApp, C=SA"
          
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ خطأ حرج: لم يتم العثور على ملف APK الناتج!"
            exit 1
          fi
          
          cp "$APK_PATH" ./releases/arabic-quiz-release-unaligned.apk
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          
          $BUILD_TOOLS/zipalign -v 4 ./releases/arabic-quiz-release-unaligned.apk ./releases/arabic-quiz-release-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-key-alias playkey --ks-pass pass:android123 --key-pass pass:android123 --out ./releases/arabic-quiz-signed-release.apk ./releases/arabic-quiz-release-aligned.apk
          $BUILD_TOOLS/apksigner verify ./releases/arabic-quiz-signed-release.apk
          
          rm -f ./releases/arabic-quiz-release-unaligned.apk ./releases/arabic-quiz-release-aligned.apk release.keystore
          
          echo "✓ Signed APK: releases/arabic-quiz-signed-release.apk"
          ls -lh releases/
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-signed
          path: releases/arabic-quiz-signed-release.apk
          retention-days: 14
      - name: Commit dist/index.html and releases/*.apk back to repo (auto-commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # إزالة مجلد dist وملف index.html من ذاكرة الحظر المؤقتة للـ Git وإضافتهما كلياً بالإجبار
          git rm -r --cached dist/ || true
          git add -f dist/index.html
          git add -f releases/arabic-quiz-signed-release.apk
          
          # الفحص برمجياً إذا كان هناك أي تحديث في الملفات
          if git diff --staged --quiet; then
            echo "لا توجد تغييرات لإضافتها للمستودع."
          else
            git commit -m "🤖 أتمتة: تحديث إجباري لملف الـ Single File index.html وتطبيق الـ APK [skip ci]"
            git push
          fi
