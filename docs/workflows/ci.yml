# ============================================================
# CI — Main Continuous Integration Workflow
# V15.0 — Phase 2 (T-024)
# ============================================================
# Runs on every pull request and push to main/develop.
# Pipeline: install → lint → test → build → bundle-size-check → coverage-upload
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same PR/branch when new commits arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ──
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint -- --max-warnings=0
      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{js,css,html}" "tests/**/*.{js,js}"

  # ── Job 2: Unit tests + coverage ──
  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest with coverage
        run: npm test -- --coverage --reporter=verbose
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/coverage/lcov.info
          fail_ci_if_error: false
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/coverage/
            tests/results/

  # ── Job 3: Build (single-file output) ──
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run syntax check on all source files
        run: |
          for f in src/app/*.js; do
            node --check "$f" || exit 1
          done
          echo "✓ All source files pass syntax check"
      - name: Build single-file output
        run: npm run build
        env:
          NODE_ENV: production
      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ dist/index.html not found"
            exit 1
          fi
          SIZE=$(stat -c%s dist/index.html)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Build size: ${SIZE_MB} MB"
          # Fail if build exceeds 8 MB (regression detection)
          if [ $SIZE_MB -gt 8 ]; then
            echo "❌ Build size ${SIZE_MB}MB exceeds 8MB threshold (regression!)"
            exit 1
          fi
          echo "✓ Build size within threshold"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Job 4: Bundle size check (regression detection) ──
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Check bundle size
        run: |
          SIZE=$(stat -c%s dist/index.html)
          SIZE_KB=$((SIZE / 1024))
          echo "Bundle size: ${SIZE_KB} KB"
          # Target: < 5100 KB (5.1 MB) per development plan
          if [ $SIZE_KB -gt 5100 ]; then
            echo "⚠️  Bundle size ${SIZE_KB}KB exceeds 5100KB target"
            # Warning only — don't fail the build for now
            # exit 1
          fi

  # ── Job 5: Android APK build (only on main/develop push, not PRs) ──
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
